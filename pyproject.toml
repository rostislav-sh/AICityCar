[project]
name = "aicitycar"
version = "0.1.0"
description = "Тестовое задание CityCar: сделки amoCRM без задач или с просроченными задачами"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "pydantic>=2.9",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
